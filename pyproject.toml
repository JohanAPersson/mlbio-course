[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Package name. Must be a valid Python identifier (not a bare number such as "2026").
name = "bioml"
version = "1.0.0"
description = "Course package for ML for Bioprocesses: data loading, splitting, CV and plotting primitives."
readme = "README.md"
# >=3.10 so the package installs on Colab's current Python.
requires-python = ">=3.10"
# Deliberately unpinned: Colab already provides these. Pinning would make pip
# replace Colab's versions and force a runtime restart during setup.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
# The source lives in src/bioml; it is installed as the top-level package "bioml".
# Named explicitly so notebooks/ and scripts/ are never packaged.
packages = ["src/bioml"]

[tool.uv]
# Build and install the project itself as a package when using uv locally.
package = true